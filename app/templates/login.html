<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login | Predictive Student Success Monitoring System
    </title>
</head>

<body>

    <h1>Predictive Student Success Monitoring System</h1>

    <h2>Login</h2>


    <!-- Flash Messages -->

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <p>
                    {{ message }}
                </p>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <!-- Login Form -->

    <form
        method="POST"
        action="{{ url_for('login') }}"
    >

        <div>

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                required
            >

        </div>

        <br>


        <div>

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >

        </div>

        <br>


        <button type="submit">
            Login
        </button>

    </form>

</body>

</html>
